# Build the site and publish it to the Plesk server on every push to the main
# branch (or by hand from the Actions tab). Replaces uploading zips.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      160.153.174.40
#   DEPLOY_USER      Plesk system user for legendary-retreats.com
#   DEPLOY_PASSWORD  that user's password (used for FTPS)
#   DEPLOY_SSH_KEY   optional: a private key authorised for that user. When set,
#                    the deploy uses SFTP with the key instead of FTPS. (The
#                    server's SSH accepts keys only, not passwords.)
#
# The sync uploads the build and deletes files that are no longer in it, but
# never touches .well-known/ (Let's Encrypt renewals) or cgi-bin/. A build
# stamp (/build.txt = commit SHA) lets the last step prove the new version is live.
name: Deploy

on:
  push:
    branches: [claude/exciting-shannon-exms0i]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the generator dates articles and the sitemap from git.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q "analytics are OFF" build.log; then
            echo "::error::Analytics IDs missing in site.config.mjs; refusing to deploy."
            exit 1
          fi
          test -f dist/index.html && test -f dist/404.html
          echo "$GITHUB_SHA" > dist/build.txt
          node scripts/indexnow.mjs manifest

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Connection problems are reported as annotations (visible on the run
      # summary) so a failed deploy says why without digging through logs.
      - name: Choose the transfer method
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] || { echo "::error::DEPLOY_HOST / DEPLOY_USER secret is empty"; exit 1; }
          cat > ~/.lftprc <<'EOF'
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          EOF
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "set sftp:connect-program 'ssh -a -x -i ~/.ssh/deploy_key -o IdentitiesOnly=yes'" >> ~/.lftprc
            echo "LFTP_URL=sftp://$DEPLOY_USER:@$DEPLOY_HOST" >> "$GITHUB_ENV"
            echo "::notice::Transfer: SFTP with SSH key"
          else
            [ -n "$DEPLOY_PASSWORD" ] || { echo "::error::DEPLOY_PASSWORD secret is empty"; exit 1; }
            timeout 15 bash -c "</dev/tcp/$DEPLOY_HOST/21" || { echo "::error::Cannot reach FTP port 21 on the server"; exit 1; }
            # Explicit TLS. Plesk's FTP certificate is usually issued for the
            # server name, not this IP, so it is not hostname-verified; the
            # session is still encrypted.
            cat >> ~/.lftprc <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          EOF
            echo "LFTP_URL=ftp://$DEPLOY_HOST" >> "$GITHUB_ENV"
            echo "LFTP_USE_PASSWORD=1" >> "$GITHUB_ENV"
            echo "::notice::Transfer: FTPS (FTP over TLS) with the account password"
          fi

      - name: Check the server login
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          auth=(-u "$DEPLOY_USER,"); [ -n "$LFTP_USE_PASSWORD" ] && auth=(--env-password -u "$DEPLOY_USER")
          set +e
          out=$(printf 'set net:max-retries 1\npwd\ncls -1\nbye\n' | lftp "${auth[@]}" "$LFTP_URL" 2>&1)
          rc=$?
          set -e
          echo "$out" | head -20 | while IFS= read -r line; do echo "::notice::lftp: $line"; done
          [ $rc -eq 0 ] || { echo "::error::Login or listing failed (exit $rc). See the lftp notices."; exit 1; }
          echo "$out" | grep -qx "httpdocs/\?" || echo "::warning::No httpdocs in the login directory; listing shown above"

      # The live site's page hashes, so only pages that changed are sent to IndexNow.
      - name: Fetch the live page hashes
        run: curl -sf https://www.legendary-retreats.com/page-hashes.json -o /tmp/old-hashes.json || echo "::notice::No live page-hashes.json yet; IndexNow will receive every page"

      - name: Sync dist/ to httpdocs
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          auth=(-u "$DEPLOY_USER,"); [ -n "$LFTP_USE_PASSWORD" ] && auth=(--env-password -u "$DEPLOY_USER")
          set +e
          lftp "${auth[@]}" "$LFTP_URL" > sync.log 2>&1 <<'EOF'
          cd httpdocs
          mirror --reverse --delete --parallel=4 --verbose=1 --exclude-glob .well-known/ --exclude-glob cgi-bin/ dist/ .
          bye
          EOF
          rc=$?
          set -e
          tail -n 40 sync.log
          if [ $rc -ne 0 ]; then
            grep -iv "^Transferring\|^Removing" sync.log | tail -n 8 | while IFS= read -r line; do echo "::error::lftp: $line"; done
            exit $rc
          fi
          echo "::notice::Synced $(grep -c '^Transferring' sync.log) files, removed $(grep -c '^Removing' sync.log)"

      - name: Check the live site
        run: |
          sleep 5
          live=$(curl -s https://www.legendary-retreats.com/build.txt)
          echo "live build: $live  expected: $GITHUB_SHA"
          test "$live" = "$GITHUB_SHA"
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' https://www.legendary-retreats.com/)
          echo "home: $code"
          test "$code" = "200"
          grep -q "Legendary Retreats" /tmp/home.html
          kit=$(curl -s -o /dev/null -w '%{http_code}' https://www.legendary-retreats.com/retreat-planning-kit/)
          echo "kit page: $kit"
          test "$kit" = "200"

      # Bing (ChatGPT search, Copilot) and other IndexNow engines hear about
      # changed pages immediately. Never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs submit /tmp/old-hashes.json
