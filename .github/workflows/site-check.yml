# Manual diagnostic: is the live site reachable, and if not, is it DNS or the
# web server? Run from the Actions tab (Site check -> Run workflow). Results
# are posted as notices on the run summary.
name: Site check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check DNS and the web server
        run: |
          note() { echo "::notice::$*"; }
          for n in legendary-retreats.com www.legendary-retreats.com; do
            note "DNS $n A=[$(dig +short A $n | tr '\n' ' ')] CNAME=[$(dig +short CNAME $n | tr '\n' ' ')]"
          done
          note "NS=[$(dig +short NS legendary-retreats.com | tr '\n' ' ')]"
          for u in https://www.legendary-retreats.com/ https://legendary-retreats.com/ http://www.legendary-retreats.com/; do
            r=$(curl -sS -o /dev/null -m 20 -w 'code=%{http_code} ip=%{remote_ip}' "$u" 2>&1 | tr '\n' ' ')
            note "GET $u -> $r"
          done
          for p in 21 80 443; do
            if timeout 10 bash -c "</dev/tcp/160.153.174.40/$p" 2>/dev/null; then note "server port $p open"; else note "server port $p closed"; fi
          done
          r=$(curl -sS -k -m 20 --resolve www.legendary-retreats.com:443:160.153.174.40 -w ' code=%{http_code}' https://www.legendary-retreats.com/build.txt 2>&1 | tr '\n' ' ')
          note "direct to 160.153.174.40 build.txt -> $r"
