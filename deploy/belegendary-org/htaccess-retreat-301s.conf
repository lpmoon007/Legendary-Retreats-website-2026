RedirectMatch 301 ^/denver-executive-leadership-retreat/?$  https://www.legendary-retreats.com/executive-off-road-immersion/
RedirectMatch 301 ^/sedona-executive-leadership-retreat/?$  https://www.legendary-retreats.com/executive-off-road-immersion/
# ~38 external links
