# ── belegendary.org → legendary-retreats.com retreat 301s (Apache .htaccess) ──
# Paste into belegendary.org public/.htaccess. Apply ONLY after
# www.legendary-retreats.com is deployed, verified, and no longer runs the old
# legendary-retreats.com → belegendary.org redirector (see README.md, or every
# retreat URL loops between the two domains).
#
# Rules: target host www.legendary-retreats.com, trailing slash, single hop.
# Apache does NOT allow trailing comments on a directive line: a "# ..." after
# a Redirect is read as extra arguments and the whole .htaccess fails (HTTP 500
# site-wide). Keep every comment on its own line.
#
# RedirectMatch with ^...?$ = exact path, with or without the trailing slash
# (one hop either way) and no accidental prefix matches.

# A. Retreat pages (drop /teams/, keep the leaf)
RedirectMatch 301 ^/teams/retreats/?$                              https://www.legendary-retreats.com/
RedirectMatch 301 ^/teams/retreats/destinations/?$                 https://www.legendary-retreats.com/destinations/
RedirectMatch 301 ^/teams/retreats/formats/?$                      https://www.legendary-retreats.com/formats/
RedirectMatch 301 ^/teams/retreats/ways-to-work-together/?$        https://www.legendary-retreats.com/ways-to-work-together/
RedirectMatch 301 ^/teams/retreats/for-executive-assistants/?$     https://www.legendary-retreats.com/for-executive-assistants/
RedirectMatch 301 ^/teams/luxury-executive-retreat/?$              https://www.legendary-retreats.com/luxury-executive-retreat/
RedirectMatch 301 ^/teams/corporate-retreat-ideas/?$               https://www.legendary-retreats.com/corporate-retreat-ideas/
RedirectMatch 301 ^/teams/executive-offsite-ideas/?$               https://www.legendary-retreats.com/executive-offsite-ideas/
RedirectMatch 301 ^/teams/leadership-retreat-ideas/?$              https://www.legendary-retreats.com/leadership-retreat-ideas/
RedirectMatch 301 ^/teams/executive-immersion/?$                   https://www.legendary-retreats.com/executive-immersion/
RedirectMatch 301 ^/teams/executive-immersion/(expedition|city|ownership|the-city-never-sleeps)/?$  https://www.legendary-retreats.com/executive-immersion/$1/
RedirectMatch 301 ^/(sailing-team-building|executive-off-road-immersion|retreat-planning-kit)/?$     https://www.legendary-retreats.com/$1/
RedirectMatch 301 ^/(how-to-plan-a-leadership-retreat|how-to-plan-an-executive-offsite|leadership-offsite-agenda|why-leadership-offsites-dont-stick|leadership-team-offsite-facilitator)/?$  https://www.legendary-retreats.com/$1/

# B. Case studies (all five are retreat engagements) + the index + the kit PDF
RedirectMatch 301 ^/case-studies/(online-auto-retailer-leadership-team|san-juan-mountains-work-ethic|everglades-abundance-mindset|federal-fiscal-leadership-team|alaska-executive-vulnerability)/?$  https://www.legendary-retreats.com/case-studies/$1/
RedirectMatch 301 ^/case-studies/?$                                https://www.legendary-retreats.com/case-studies/
# Linked from already-sent HubSpot kit emails; same path on the new domain.
RedirectMatch 301 ^/assets/downloads/complete-retreat-planning-kit\.pdf$  https://www.legendary-retreats.com/assets/downloads/complete-retreat-planning-kit.pdf

# C. REPLACE these existing lines in place (they point at pages that are
# moving, so leaving them creates a 2-hop chain). Delete the old versions:
#   Redirect 301 /shakubuku/ /teams/retreats/
#   Redirect 301 /extreme-retreats/ /teams/retreats/
#   Redirect 301 /experiential-leadership-retreats/ /teams/retreats/
#   Redirect 301 /denver-executive-leadership-retreat/ /executive-off-road-immersion/
#   Redirect 301 /sedona-executive-leadership-retreat/ /executive-off-road-immersion/
#   Redirect 301 /effective-facilitator-workshop/ /leadership-team-offsite-facilitator/
#   Redirect 301 /hvac_case_study/ /case-studies/
