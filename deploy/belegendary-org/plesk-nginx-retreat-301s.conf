# ── belegendary.org → legendary-retreats.com retreat 301s (nginx parity) ─────
# Mirror of htaccess-retreat-301s.conf for belegendary.org's
# redirects/plesk-nginx-redirects.conf ("Additional nginx directives", server
# context). Same apply rule: only after www.legendary-retreats.com is live and
# its old redirector to belegendary.org is gone.
#
# Server-level rewrites run before location matching, so these also win over
# Plesk's static /assets/ handling. `permanent` = 301; the query string is kept.

# A. Retreat pages
rewrite ^/teams/retreats/?$                          https://www.legendary-retreats.com/ permanent;
rewrite ^/teams/retreats/(destinations|formats|ways-to-work-together|for-executive-assistants)/?$  https://www.legendary-retreats.com/$1/ permanent;
rewrite ^/teams/(luxury-executive-retreat|corporate-retreat-ideas|executive-offsite-ideas|leadership-retreat-ideas)/?$  https://www.legendary-retreats.com/$1/ permanent;
rewrite ^/teams/executive-immersion/?$               https://www.legendary-retreats.com/executive-immersion/ permanent;
rewrite ^/teams/executive-immersion/(expedition|city|ownership|the-city-never-sleeps)/?$  https://www.legendary-retreats.com/executive-immersion/$1/ permanent;
rewrite ^/(sailing-team-building|executive-off-road-immersion|retreat-planning-kit)/?$  https://www.legendary-retreats.com/$1/ permanent;
rewrite ^/(how-to-plan-a-leadership-retreat|how-to-plan-an-executive-offsite|leadership-offsite-agenda|why-leadership-offsites-dont-stick|leadership-team-offsite-facilitator)/?$  https://www.legendary-retreats.com/$1/ permanent;

# B. Case studies + index + kit PDF
rewrite ^/case-studies/(online-auto-retailer-leadership-team|san-juan-mountains-work-ethic|everglades-abundance-mindset|federal-fiscal-leadership-team|alaska-executive-vulnerability)/?$  https://www.legendary-retreats.com/case-studies/$1/ permanent;
rewrite ^/case-studies/?$                            https://www.legendary-retreats.com/case-studies/ permanent;
rewrite ^/assets/downloads/complete-retreat-planning-kit\.pdf$  https://www.legendary-retreats.com/assets/downloads/complete-retreat-planning-kit.pdf permanent;

# C. REPLACE the existing lines for these sources in plesk-nginx-redirects.conf
# (they currently point at /teams/retreats/, /executive-off-road-immersion/,
# /leadership-team-offsite-facilitator/ and /case-studies/, all moving).
rewrite ^/shakubuku/?$                               https://www.legendary-retreats.com/ permanent;
rewrite ^/extreme-retreats/?$                        https://www.legendary-retreats.com/ permanent;
rewrite ^/experiential-leadership-retreats/?$        https://www.legendary-retreats.com/ permanent;
rewrite ^/denver-executive-leadership-retreat/?$     https://www.legendary-retreats.com/executive-off-road-immersion/ permanent;
rewrite ^/sedona-executive-leadership-retreat/?$     https://www.legendary-retreats.com/executive-off-road-immersion/ permanent;
rewrite ^/effective-facilitator-workshop/?$          https://www.legendary-retreats.com/leadership-team-offsite-facilitator/ permanent;
rewrite ^/hvac_case_study/?$                         https://www.legendary-retreats.com/case-studies/ permanent;
