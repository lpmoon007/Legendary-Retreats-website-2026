# ── Legendary Retreats — nginx site config ───────────────────────────────────
# Place at: /etc/nginx/sites-available/legendary-retreats.conf
# Enable:   ln -s /etc/nginx/sites-available/legendary-retreats.conf \
#                 /etc/nginx/sites-enabled/legendary-retreats.conf
# The site is fully static (Astro build output). Web root below points at dist/.
#
# Canonical host is  www.legendary-retreats.com  (matches the <link rel=canonical>
# and og:url baked into every page). Apex + http are 301'd to https://www.
# ─────────────────────────────────────────────────────────────────────────────

# 301 map, matched on $uri (path only, no query). Every target is final: no
# chains. Regex entries accept the path with or without a trailing slash.
# (map must live in the http context; a file in conf.d/ or an included site file
#  is inside http, so this is fine here.)
map $uri $lr_redirect {
    default                                   "";
    # Old Wix URLs
    ~^/about-4/?$                             /about/;
    ~^/contact-4/?$                           /contact/;
    ~^/book/?$                                /contact/;
    ~^/projects-8/?$                          /experience/;
    ~^/gallery(-1)?/?$                        /experience/;
    ~^/film/?$                                /experience/;
    ~^/copy-of-home/?$                        /;
    ~^/leadership/?$                          /;
    ~^/leadership-retreats-1/?$               /;
    ~^/retreats/?$                            /;
    ~^/services/?$                            /;
    # June 2026 pages retired in the Oct 2026 consolidation
    ~^/leadership-retreats/?$                 /;
    ~^/formats/off-road-immersion/?$          /executive-off-road-immersion/;
    ~^/sailing-offsites/?$                    /sailing-team-building/;
    ~^/executive-offsite-agenda/?$            /leadership-offsite-agenda/;
    ~^/executive-offsite-facilitator/?$       /leadership-team-offsite-facilitator/;
    ~^/executive-offsites/?$                  /how-to-plan-an-executive-offsite/;
    ~^/team-offsite-ideas/?$                  /executive-offsite-ideas/;
    # Flag Model content lives on belegendary.org (one entity per framework)
    ~^/framework/?$                           https://www.belegendary.org/flag-model/;
    ~^/is-this-your-team/?$                   https://www.belegendary.org/flag-model/;
    ~^/the-connection-deficit/?$              https://www.belegendary.org/flag-model/;
}

# ── 1. http :80  → redirect everything to https (keep ACME path open) ─────────
server {
    listen 80;
    listen [::]:80;
    server_name legendary-retreats.com www.legendary-retreats.com;

    # Let certbot answer the ACME challenge over http.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://www.legendary-retreats.com$request_uri; }
}

# ── 2. https apex  → redirect to https://www ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legendary-retreats.com;

    ssl_certificate     /etc/letsencrypt/live/www.legendary-retreats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.legendary-retreats.com/privkey.pem;

    return 301 https://www.legendary-retreats.com$request_uri;
}

# ── 3. https www  → serve the static site ────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.legendary-retreats.com;

    root /var/www/legendary-retreats/httpdocs;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/www.legendary-retreats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.legendary-retreats.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security / SEO headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip (always available). brotli below is optional (needs ngx_brotli module).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml
               application/rss+xml application/manifest+json;

    # brotli on;            # uncomment if ngx_brotli is compiled in
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/javascript
    #              application/json image/svg+xml application/xml;

    # Apply the Wix → clean-slug 301 map.
    if ($lr_redirect) { return 301 $lr_redirect; }

    # Long-cache fingerprinted/static assets (images are already WebP).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Root-level SEO files (served from dist/).
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { add_header Cache-Control "public, max-age=3600"; }

    # Clean URLs: Astro emits /<slug>/index.html, so a directory match resolves.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;   # Astro emits dist/404.html if a 404 page exists
}
