# NOTE (Nov 2026): the live redirects are the Apache version in
# docs/handoffs/legendary-retreats-apache-paste.txt (Plesk "Additional directives
# for HTTP/HTTPS"). This Plesk has no nginx directives box. Edit both files together.
#
# Plesk → Domains → legendary-retreats.com → Apache & nginx Settings
#        → "Additional nginx directives"  (paste the block below, then OK/Apply)
#
# These run INSIDE the server{} block Plesk generates, so:
#  - NO server{}, listen, ssl_certificate, or `map` (map needs http context).
#  - HTTP→HTTPS redirect, www canonical, gzip, and clean-URL/trailing-slash
#    handling are done by Plesk settings / Apache — not here.
#
# 301 redirects (keep in sync with the map in deploy/nginx.conf). Targets are
# final (no chains); each pattern accepts the path with or without a trailing slash.
# Old Wix URLs
location ~ ^/about-4/?$                             { return 301 /about/; }
location ~ ^/contact-4/?$                           { return 301 /contact/; }
location ~ ^/book/?$                                { return 301 /contact/; }
location ~ ^/projects-8/?$                          { return 301 /experience/; }
location ~ ^/gallery(-1)?/?$                        { return 301 /experience/; }
location ~ ^/film/?$                                { return 301 /experience/; }
location ~ ^/copy-of-home/?$                        { return 301 /; }
location ~ ^/leadership/?$                          { return 301 /; }
location ~ ^/leadership-retreats-1/?$               { return 301 /; }
location ~ ^/retreats/?$                            { return 301 /; }
location ~ ^/services(-[0-9]+)?/?$                  { return 301 /; }
# June 2026 pages retired in the Oct 2026 consolidation
location ~ ^/leadership-retreats/?$                 { return 301 /; }
location ~ ^/formats/off-road-immersion/?$          { return 301 /executive-off-road-immersion/; }
location ~ ^/sailing-offsites/?$                    { return 301 /sailing-team-building/; }
location ~ ^/executive-offsite-agenda/?$            { return 301 /leadership-offsite-agenda/; }
location ~ ^/executive-offsite-facilitator/?$       { return 301 /leadership-team-offsite-facilitator/; }
location ~ ^/executive-offsites/?$                  { return 301 /how-to-plan-an-executive-offsite/; }
location ~ ^/team-offsite-ideas/?$                  { return 301 /executive-offsite-ideas/; }
# Flag Model content lives on belegendary.org
location ~ ^/framework/?$                           { return 301 https://www.belegendary.org/flag-model/; }
location ~ ^/is-this-your-team/?$                   { return 301 https://www.belegendary.org/flag-model/; }
location ~ ^/the-connection-deficit/?$              { return 301 https://www.belegendary.org/flag-model/; }

# Old belegendary.org-style paths typed or cited against this domain (Nov 2026)
location ~ ^/teams/retreats/?$                      { return 301 /; }
location ~ ^/teams/retreats/(.+)$                   { return 301 /$1; }
location ~ ^/retreats/(.+)$                         { return 301 /$1; }
location ~ ^/teams/(corporate-retreat-ideas|leadership-retreat-ideas|executive-offsite-ideas|luxury-executive-retreat|executive-immersion)(/.*)?$ { return 301 /$1$2; }

# Long-cache static assets (images are already WebP; build assets are hashed).
location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
location ^~ /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
