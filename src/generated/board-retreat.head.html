{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a board retreat?","acceptedAnswer":{"@type":"Answer","text":"A board retreat is an extended meeting, usually one to three days and away from the usual boardroom, where directors and the CEO work on strategy, the board-management relationship or the board's own effectiveness, rather than routine oversight business."}},{"@type":"Question","name":"How long should a board retreat be?","acceptedAnswer":{"@type":"Answer","text":"One to two days for most boards. One day is enough for a single focused decision; two days allows the trust-building and the hard conversation that make decisions stick."}},{"@type":"Question","name":"Should the CEO attend the board retreat?","acceptedAnswer":{"@type":"Answer","text":"Almost always, and often selected executives too. Plan at least one session with directors only, so the board can discuss the CEO relationship candidly."}},{"@type":"Question","name":"Who should facilitate a board retreat?","acceptedAnswer":{"@type":"Answer","text":"An outside facilitator, so the chair and CEO can participate rather than run the room. Look for someone who will design to an outcome, handle conflict between directors and management, and follow through afterward."}},{"@type":"Question","name":"How much does a board retreat cost?","acceptedAnswer":{"@type":"Answer","text":"With Legendary Retreats, $35,000 to $50,000 for a Focused retreat and $45,000 to $150,000 for a Signature retreat, exclusive of air travel. Fully bespoke retreats run $75,000 and up."}},{"@type":"Question","name":"How often should a board hold a retreat?","acceptedAnswer":{"@type":"Answer","text":"Once a year is common, often timed before the annual planning cycle or after a board evaluation."}}]}
