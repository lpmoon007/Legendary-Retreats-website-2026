":"WebPage","@id":"https://www.legendary-retreats.com/executive-off-road-immersion/#webpage","url":"https://www.legendary-retreats.com/executive-off-road-immersion/","name":"The Off-Road Immersion — An Executive Leadership Offsite","description":"A private, one-day off-road leadership immersion within reach of Las Vegas, Phoenix, Denver, Los Angeles or Salt Lake City, led by James Carter. Where real terrain, real stakes, and real reflection build trust no boardroom can.","inLanguage":"en-US","isPartOf":{"@id":"https://www.belegendary.org/#website"},"primaryImageOfPage":{"@type":"ImageObject","url":"https://www.belegendary.org/assets/share-card.png"},"speakable":{"@type":"SpeakableSpecification","cssSelector":["h1",".bl-speakable"]}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","name":"Legendary Retreats","item":"https://www.legendary-retreats.com/","position":1},{"@type":"ListItem","position":2,"name":"Off-Road Immersion","item":"https://www.legendary-retreats.com/executive-off-road-immersion/"}]},{"@type":"Service","@id":"https://www.legendary-retreats.com/executive-off-road-immersion/#service","name":"Off-Road Immersion — Executive Leadership Offsite","serviceType":"Executive leadership offsite","provider":{"@id":"https://www.legendary-retreats.com/#org"},"areaServed":[{"@type":"City","name":"Las Vegas"},{"@type":"City","name":"Phoenix"},{"@type":"City","name":"Scottsdale"},{"@type":"City","name":"Sedona"},{"@type":"City","name":"Denver"},{"@type":"City","name":"Boulder"},{"@type":"City","name":"Los Angeles"},{"@type":"City","name":"Salt Lake City"},{"@type":"AdministrativeArea","name":"Nevada"},{"@type":"AdministrativeArea","name":"Arizona"},{"@type":"AdministrativeArea","name":"Colorado"},{"@type":"AdministrativeArea","name":"California"},{"@type":"AdministrativeArea","name":"Utah"}],"description":"A private, one-day executive leadership immersion led by James Carter, run on real off-road terrain within reach of a major Western city — Las Vegas, Phoenix–Scottsdale, Denver–Boulder, Los Angeles or Salt Lake City. Small executive teams spend a day off-road — two per Jeep, everyone driving and deciding — with facilitated leadership reflection tied to what happens on the trail. By invitation.","audience":{"@type":"Audience","audienceType":"Executive teams"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Where does the Off-Road Immersion take place?","acceptedAnswer":{"@type":"Answer","text":"Within reach of a major Western city — you fly in, and it is roughly 30 to 100 minutes to the trailhead. We run it near Las Vegas (the Mojave), Phoenix–Scottsdale (the Sonoran Desert), the Sedona red rock (a little further, about two hours out of Phoenix, and worth it), Denver–Boulder (the Front Range high country), Los Angeles (Hungry Valley, out of Santa Clarita), and Salt Lake City (desert, canyon and Little Moab). What makes it singular is not the location; it is James and the method. Multi-day expeditions on iconic routes — the San Juan Alpine Loop, Moab, the Rubicon — are arranged directly."}},{"@type":"Question","name":"Is there a minimum group size?","acceptedAnswer":{"@type":"Answer","text":"No — we have hosted teams as small as two. It is built to be small and high-touch (two executives per Jeep). There is a minimum investment for the day regardless of headcount, which we share when you enquire."}},{"@type":"Question","name":"When can we do it?","acceptedAnswer":{"@type":"Answer","text":"It depends on the setting, and between them we can host in most seasons. The desert metros — Las Vegas, Phoenix and Salt Lake City — run best October through April; Sedona runs close to year-round, with spring and fall the best windows; Denver–Boulder is a summer-to-early-fall high-country window (roughly June through October); Los Angeles is best in spring and fall. We take a small number of executive teams each season, so dates are limited and arranged directly."}},{"@type":"Question","name":"Do we need off-road experience or to be especially fit?","acceptedAnswer":{"@type":"Answer","text":"No experience is required. Professional off-road guides lead every mile, the vehicles are provided, and the day is risk-managed throughout. It is challenging and dramatic by design, but safe and guided — the difficulty is emotional and relational, not athletic."}},{"@type":"Question","name":"How much does it cost?","acceptedAnswer":{"@type":"Answer","text":"This is an invitation, not a package, so there is no public price. There is a minimum investment for the day, which we share when you start the conversation. Tell us about your team and what you are trying to become, and we will take it from there."}},{"@type":"Question","name":"What is included?","acceptedAnswer":{"@type":"Answer","text":"Everything but your arrival: James Carter-led facilitation, professional guides and all vehicles (two guests per Jeep), group staging and ground shuttle, premium food and beverage, and all permits, insurance, safety, and logistics. A pre-day alignment call tailors the leadership focus to your team’s real situation."}}]}]}</script>
