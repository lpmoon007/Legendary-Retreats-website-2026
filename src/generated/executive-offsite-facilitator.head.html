{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What does an executive offsite facilitator actually do?","acceptedAnswer":{"@type":"Answer","text":"Before the offsite, a facilitator helps define the one outcome and designs the arc to reach it. During it, they run the room — asking the hard questions, surfacing what isn't being said, managing conflict, and keeping every session pointed at the outcome so the leader can participate as a peer. After it, they drive the follow-up that turns insight into changed behavior."}},{"@type":"Question","name":"Why use an outside facilitator instead of someone internal?","acceptedAnswer":{"@type":"Answer","text":"Because the people who most need to be in the conversation — the CEO, the senior team — can't also be neutral referees of it. An internal facilitator has a stake in the outcome and can't ask the question that implicates the boss. A neutral outsider can hold the room through hard moments and say the thing no insider can."}},{"@type":"Question","name":"Do you facilitate in person or virtually?","acceptedAnswer":{"@type":"Answer","text":"Both, though the work we're known for is in person — immersive, experiential offsites and retreats where the environment does part of the teaching. We also facilitate focused virtual and on-site sessions when that fits the outcome and constraints."}},{"@type":"Question","name":"How much does executive offsite facilitation cost?","acceptedAnswer":{"@type":"Answer","text":"Facilitation is part of a designed engagement rather than an hourly add-on. Ready-to-run Signature offsites run roughly $5,000–$12,000 per person; fully bespoke, turnkey retreats run $75,000–$500,000+, with design, facilitation, and 30-day reinforcement included."}},{"@type":"Question","name":"How do we choose the right facilitator?","acceptedAnswer":{"@type":"Answer","text":"Look for someone who starts with your outcome rather than their fixed program, has real experience inside executive teams (not just a workshop deck), will tell you honestly when an offsite isn't the answer, and builds in follow-up so the change is measured rather than assumed."}}]}
</script>
