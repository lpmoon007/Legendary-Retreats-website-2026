"url":"https://www.belegendary.org/assets/share-card.png"},"breadcrumb":{"@id":"https://www.legendary-retreats.com/#breadcrumb"},"speakable":{"@type":"SpeakableSpecification","cssSelector":["h1",".bl-speakable"]}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a leadership retreat?","acceptedAnswer":{"@type":"Answer","text":"A leadership retreat is a multi-day, off-site gathering where an executive team steps out of operations to work on how it leads together — how it decides, aligns, and holds itself accountable — rather than on the day-to-day. Done seriously, it isn’t a scenic offsite or a team-building day: it’s a facilitated experience built around one real outcome, run so the experience turns into commitments, and reinforced afterward so the change survives the trip home. The setting is the retreat; the product is the behavior change."}},{"@type":"Question","name":"How much does an executive leadership retreat cost?","acceptedAnswer":{"@type":"Answer","text":"A serious executive leadership retreat generally runs from about $35,000 for a Focused, ready-to-run format up to $500,000+ for a fully bespoke engagement — driven by group size, destination, duration, and how much diagnosis, customization and follow-through is built in. The number that matters isn’t the fee but the cost of the problem you’re solving; a retreat that actually changes how the team executes returns many times its price, while a scenic offsite that changes nothing is expensive at any number."}},{"@type":"Question","name":"Is this an executive team building retreat?","acceptedAnswer":{"@type":"Answer","text":"Yes — but not an activities day dressed up as one. An executive team building retreat, the way we run it, is a facilitated multi-day experience built around one real outcome your team needs to reach. The experience becomes a laboratory for how the team actually decides and executes — then it is reinforced for 30 days so the change survives the trip home. The setting is the retreat; the product is the behavior change."}},{"@type":"Question","name":"What is the difference between an executive team building retreat and a corporate offsite?","acceptedAnswer":{"@type":"Answer","text":"An offsite is a block of time away from operations. A retreat is the facilitated version of it — built around a diagnosed outcome, run so the experience becomes commitments, and followed through afterward. A retreat with no real outcome and no follow-through is just an offsite with better catering. The question is never “where do we go?” but “what are we here to change, and how will we know it did?”"}},{"@type":"Question","name":"How long is an executive team building retreat, and where does it run?","acceptedAnswer":{"@type":"Answer","text":"Most run multi-day, at curated venues — domestic or international — chosen to fit the outcome, not the other way around. We handle the venue, travel, food, facilitation and the 30-day reinforcement end to end; you bring the team and the outcome. A single dramatic day is possible when that is the right container, but the retreats are built for a depth a day cannot reach."}},{"@type":"Question","name":"Where are the best executive retreat locations?","acceptedAnswer":{"@type":"Answer","text":"The best executive retreat location is the one that fits the outcome, not the brochure. We run retreats at curated destinations — mountain, desert, coastal, backcountry and international — and choose the setting to serve what the team is there to change: a place remote enough to break routine, demanding enough to surface how the team actually operates, and comfortable enough that the work, not the logistics, is the hard part. We handle venue, travel and food end to end. The setting matters, but it is the container for the change, never the point of it."}},{"@type":"Question","name":"Do you run luxury or private executive retreats?","acceptedAnswer":{"@type":"Answer","text":"Yes — fully private, single-team retreats, at a level o .lr-menu[open] summary span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* backdrop-filter makes .lr-hdr the containing block, so anchor the panel to it */
.lr-menu__panel{position:absolute;left:0;right:0;top:100%;height:calc(100vh - 64px);height:calc(100dvh - 64px);overflow-y:auto;background:#FBF7EF;padding:18px 24px 40px;display:flex;flex-direction:column;border-top:1px solid rgba(100,1,10,.1)}
.lr-menu__panel p{margin:18px 0 6px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#64010a}
.lr-menu__panel a{padding:11px 0;font-size:17px;color:#1C1A17;text-decoration:none;border-bottom:1px solid rgba(28,26,23,.07)}
.lr-menu__panel .lr-menu__cta{margin-top:24px;border:0;text-align:center;background:#64010a;color:#F6EFE0;border-radius:999px;padding:16px;font-weight:700}
@media (max-width:1080px){.lr-nav{gap:18px}.lr-nav__top{font-size:13.5px}}
@media (max-width:980px){.lr-nav{display:none}.lr-menu{display:block}.lr-cta{margin-left:auto}.lr-hdr__in{padding:10px 20px;gap:12px}}
@media (max-width:520px){.lr-cta{display:none}.lr-menu{margin-left:auto}.lr-brand span{font-size:13px}}
.lr-ftr{background:#0E0D0B;color:#A39A8A;font-family:'Hanken Grotesk',sans-serif;border-top:1px solid rgba(224,185,115,.18)}
.lr-ftr__in{max-width:1240px;margin:0 auto;padding:72px 32px 48px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.lr-ftr__brand>p{margin-top:18px;font-size:14.5px;line-height:1.6;max-width:34ch;color:#A39A8A}
.lr-ftr__cta{display:inline-block;margin-top:22px;color:#0E0D0B;background:#E0B973;text-decoration:none;font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px}
.lr-ftr__cta:hover{background:#C9A35E}
.lr-ftr__phone{margin-top:14px;font:500 13px 'IBM Plex Mono',monospace;letter-spacing:.06em}
.lr-ftr__phone a{color:#EDE4D3;text-decoration:none}
.lr-ftr__col{display:flex;flex-direction:column;gap:10px}
.lr-ftr__col p{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#E0B973;margin-bottom:6px}
.lr-ftr__col a{color:#C9C0B0;text-decoration:none;font-size:14px}
.lr-ftr__col a:hover{color:#FBF7EF}
.lr-ftr__base{max-width:1240px;margin:0 auto;padding:22px 32px 34px;border-top:1px solid rgba(237,228,211,.08);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#7A7064}
@media (max-width:860px){.lr-ftr__in{grid-template-columns:1fr 1fr;padding:56px 22px 36px}.lr-ftr__brand{grid-column:1/-1}.lr-ftr__base{padding:20px 22px 30px}}
@media (max-width:480px){.lr-ftr__in{grid-template-columns:1fr}}
